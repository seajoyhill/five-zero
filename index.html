<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>棋类游戏</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1 id="app-title">五子棋</h1>
      <p id="app-subtitle" class="subtitle">Gomoku</p>
    </header>

    <nav class="game-selector" aria-label="选择游戏">
      <button id="btn-game-gomoku" class="game-tab active" type="button">五子棋</button>
      <button id="btn-game-tictactoe" class="game-tab" type="button">井字棋</button>
    </nav>

    <main>
      <section id="gomoku-view" class="game-view" aria-label="五子棋">
        <div class="info-bar">
          <span id="game-status" class="status-text">点击「新游戏」开始</span>
          <span class="mode-badge">
            模式：<span id="mode-indicator">人机对战</span>
            <span class="ai-badge"> | AI：<span id="ai-type-indicator"></span></span>
          </span>
        </div>

        <div class="board-wrapper">
          <canvas id="board-canvas" aria-label="五子棋棋盘"></canvas>
        </div>

        <div class="controls">
          <button id="btn-new-game" class="btn btn-primary" type="button">新游戏</button>
          <button id="btn-switch-mode" class="btn btn-secondary" type="button">切换模式</button>
          <button id="btn-switch-ai" class="btn btn-secondary" type="button">切换 AI</button>
          <label class="strength-control" for="ai-strength-select">
            强度
            <select id="ai-strength-select">
              <option value="easy">入门（约 0.25 秒）</option>
              <option value="balanced" selected>标准（约 0.8 秒）</option>
              <option value="strong">强力（约 1.8 秒）</option>
              <option value="expert">大师（约 4 秒）</option>
            </select>
          </label>
        </div>

        <footer class="footer">
          <p>黑方先手 · 五子连珠获胜</p>
        </footer>
      </section>

      <section id="tictactoe-view" class="game-view hidden" aria-label="井字棋" aria-hidden="true">
        <div class="info-bar ttt-info-bar">
          <span id="ttt-status" class="status-text">点击「新游戏」开始</span>
          <span class="mode-badge">
            模式：<span id="ttt-mode-indicator">人机对战</span>
            <span class="ai-badge"> | AI：<span id="ttt-ai-indicator">完美策略</span></span>
          </span>
        </div>

        <div id="ttt-board" class="ttt-board" role="grid" aria-label="井字棋棋盘"></div>

        <div class="controls">
          <button id="ttt-new-game" class="btn btn-primary" type="button">新游戏</button>
          <button id="ttt-switch-mode" class="btn btn-secondary" type="button">切换模式</button>
        </div>

        <footer class="footer">
          <p>X 先手 · 横、竖、斜线连成三子获胜</p>
        </footer>
      </section>
    </main>
  </div>

  <!-- JS 加载顺序：五子棋模块 → 井字棋模块 -->
  <script src="js/board.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/mcts_ai.js"></script>
  <script src="js/remote_ai.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
  <script src="js/tic_tac_toe.js"></script>

</body>
</html>
