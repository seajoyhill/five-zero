<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1>五子棋</h1>
      <p class="subtitle">Gomoku</p>
    </header>

    <div class="info-bar">
      <span id="game-status" class="status-text">点击「新游戏」开始</span>
      <span class="mode-badge">
        模式：<span id="mode-indicator">人机对战</span>
        <span class="ai-badge"> | AI：<span id="ai-type-indicator"></span></span>
      </span>
    </div>

    <div class="board-wrapper">
      <canvas id="board-canvas"></canvas>
    </div>

    <div class="controls">
      <button id="btn-new-game" class="btn btn-primary">新游戏</button>
      <button id="btn-switch-mode" class="btn btn-secondary">切换模式</button>
      <button id="btn-switch-ai" class="btn btn-secondary">切换 AI</button>
    </div>

    <footer class="footer">
      <p>黑方先手 · 五子连珠获胜</p>
    </footer>
  </div>

  <!-- JS 加载顺序：board → ai → remote_ai → game → main -->
  <script src="js/board.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/remote_ai.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
